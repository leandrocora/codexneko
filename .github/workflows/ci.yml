name: macOS app checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public source
        run: python3 scripts/export-public-source.py
      - name: Download verified backend
        run: bash scripts/download-manager-backend.sh
      - name: Build, test, and package
        run: bash scripts/package-macos-manager.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CodexNeko-macOS-AppleSilicon
          path: |
            dist/CodexNeko-macOS-AppleSilicon.zip
            dist/CodexNeko-macOS-Installer.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
