name: Public macOS release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public source
        run: python3 scripts/export-public-source.py
      - name: Download verified backend
        run: bash scripts/download-manager-backend.sh
      - name: Compile, run tests, and package
        run: bash scripts/package-macos-manager.sh
      - uses: actions/upload-artifact@v4
        with:
          name: public-macos-release
          path: |
            dist/CodexNeko-macOS-AppleSilicon.zip
            dist/CodexNeko-macOS-Installer.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: public-macos-release
          path: dist
      - name: Publish free app downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "CodexNeko ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); else args+=(--prerelease=false); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" "${args[@]}"
            gh release upload "$GITHUB_REF_NAME" dist/CodexNeko-macOS-AppleSilicon.zip dist/CodexNeko-macOS-Installer.pkg dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/CodexNeko-macOS-AppleSilicon.zip dist/CodexNeko-macOS-Installer.pkg dist/SHA256SUMS.txt --verify-tag "${args[@]}"
          fi
